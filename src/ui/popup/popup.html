<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TogglePlay Extension</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <!-- ── Header ── -->
    <div class="header">
      <div class="header-brand">
        <img src="../../../assets/icon.png" alt="TogglePlay" class="header-logo">
        <h1>TogglePlay</h1>
      </div>
      <div class="header-controls">
        <div class="toggle-container">
          <label class="toggle-switch">
            <input type="checkbox" id="enableToggle" aria-label="Enable Auto-Toggle">
            <span class="slider"></span>
          </label>
          <span class="toggle-label">Enable</span>
        </div>
        <div class="settings-wrapper">
          <button
            type="button"
            id="settingsBtn"
            class="settings-btn"
            aria-label="Settings"
            aria-expanded="false"
            aria-controls="settingsPanel"
          >
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12.22 2h-.44a2 2 0 0 0-2 1.72l-.06.44a2 2 0 0 1-1.1 1.58l-.4.22a2 2 0 0 1-2.27-.36l-.31-.31a2 2 0 0 0-2.83 2.83l.31.31a2 2 0 0 1 .36 2.27l-.22.4a2 2 0 0 1-1.58 1.1l-.44.06a2 2 0 0 0-1.72 2v.44a2 2 0 0 0 1.72 2l.44.06a2 2 0 0 1 1.58 1.1l.22.4a2 2 0 0 1-.36 2.27l-.31.31a2 2 0 0 0 2.83 2.83l.31-.31a2 2 0 0 1 2.27-.36l.4.22a2 2 0 0 1 1.1 1.58l.06.44a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-1.72l.06-.44a2 2 0 0 1 1.1-1.58l.4-.22a2 2 0 0 1 2.27.36l.31.31a2 2 0 0 0 2.83-2.83l-.31-.31a2 2 0 0 1-.36-2.27l.22-.4a2 2 0 0 1 1.58-1.1l.44-.06a2 2 0 0 0 1.72-2v-.44a2 2 0 0 0-1.72-2l-.44-.06a2 2 0 0 1-1.58-1.1l-.22-.4a2 2 0 0 1 .36-2.27l.31-.31a2 2 0 0 0-2.83-2.83l-.31.31a2 2 0 0 1-2.27.36l-.4-.22a2 2 0 0 1-1.1-1.58l-.06-.44a2 2 0 0 0-2-2z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>
    </div>

    <!-- ── Content ── -->
    <div class="content">
      <div class="tab-selection-container">
        <!-- Current Tab -->
        <div class="tab-column">
          <div class="section-label">
            <svg class="section-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
            Current Tab
          </div>
          <div class="tab-item" id="currentTab">
            <div class="tab-info">
              <span class="tab-title">Loading current tab...</span>
              <span class="tab-url"></span>
            </div>
            <div class="tab-status">
              <span class="status-indicator active"></span>
            </div>
          </div>
        </div>

        <!-- Connection Divider -->
        <div class="connection-divider">
          <span class="line"></span>
          <span class="icon">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3v18"/><path d="m3 7 4-4 4 4"/><path d="M17 21V3"/><path d="m13 17 4 4 4-4"/></svg>
          </span>
          <span class="line"></span>
        </div>

        <!-- Available Tabs -->
        <div class="tab-column">
          <div class="section-label">
            <svg class="section-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
            Pair With
          </div>
          <div class="tab-selection">
            <div id="availableTabs" class="available-tabs">
              <div class="loading-message">Loading available tabs...</div>
            </div>
          </div>
        </div>
      </div>

      <!-- Active Pairs -->
      <div class="pairs-container">
        <div class="section-label" style="margin-bottom: 8px;">
          <svg class="section-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
          Active Pair
        </div>
        <div id="togglePairs" class="toggle-pairs">
          <div class="no-pairs">No toggle pairs configured</div>
        </div>
      </div>
    </div>

    <!-- ── Footer ── -->
    <div class="status-bar">
      <div class="connection-status">
        <span id="statusIndicator" class="status-dot"></span>
        <span id="statusText">Ready</span>
      </div>
      <div class="footer-links">
        <a href="#" id="downloadLogsLink" class="privacy-link">Download Logs</a>
        <a href="../privacy/privacy.html" target="_blank" class="privacy-link">Privacy Policy</a>
      </div>
    </div>
  </div>

  <div id="settingsPanel" class="settings-panel" role="dialog" aria-label="Settings" hidden>
    <div class="settings-panel-row">
      <div class="settings-panel-label">
        <span class="settings-panel-title">One audio at a time</span>
        <span class="settings-panel-desc">Only one tab can play sound in your browser.</span>
      </div>
      <label class="toggle-switch settings-toggle">
        <input type="checkbox" id="exclusiveModeToggle" aria-label="One audio at a time">
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <script src="../../core/config.js"></script>
  <script src="../../core/messages.js"></script>
  <script src="../../core/platforms.js"></script>
  <script src="popup.js"></script>
</body>
</html>
